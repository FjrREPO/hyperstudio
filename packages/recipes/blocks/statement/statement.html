<template>
  <!--
    STATEMENT

    One short line of copy on the film's stage, set small with space around it. At most one word sits in an
    accent chip. Variables are declared in registry-item.json (the compiler writes them onto #root).

    The scene is transparent: the film's stage shows behind the type.
    Type comes from a scale (title, display), never from the size of the canvas.
  -->
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #statement-stage {
      --st-accent: #2747f0;
      --st-ink: #17150f;
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: var(--st-ink);
    }
    .st-center {
      align-items: center;
      text-align: center;
    }
    .st-left {
      align-items: flex-start;
      text-align: left;
    }
    .st-line {
      font-weight: 500;
      line-height: 1.22;
      letter-spacing: -0.028em;
      white-space: nowrap;
    }
    .st-word {
      display: inline-block;
      position: relative;
    }
    .st-chip {
      position: absolute;
      inset: -0.02em -0.2em -0.04em;
      border-radius: 0.2em;
      background: var(--st-accent);
    }
    .st-text {
      position: relative;
    }
    .st-d-inter { font-family: "Inter", sans-serif; }
    .st-d-outfit { font-family: "Outfit", sans-serif; }
    .st-d-montserrat { font-family: "Montserrat", sans-serif; }
    .st-d-poppins { font-family: "Poppins", sans-serif; }
    .st-d-playfair-display { font-family: "Playfair Display", serif; }
    .st-d-eb-garamond { font-family: "EB Garamond", serif; }
    .st-d-oswald { font-family: "Oswald", sans-serif; }
    .st-d-archivo-black { font-family: "Archivo Black", sans-serif; font-weight: 400; }
  </style>

  <div id="root" data-composition-id="statement" data-start="0" data-duration="2" data-width="1920" data-height="1080">
    <div id="statement-stage" class="st-center">
      <div id="statement-line1" class="st-line"></div>
      <div id="statement-line2" class="st-line"></div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "statement";
      var $ = function (name) {
        return document.getElementById(ID + "-" + name);
      };
      var stage = $("stage");
      var scope = stage.closest("[data-composition-id]");
      var W = Number(scope.getAttribute("data-width")) || 1920;
      var H = Number(scope.getAttribute("data-height")) || 1080;
      var D = Number(scope.getAttribute("data-duration")) || 2;
      var U = Math.min(W, H) / 100;

      var given = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
      var v = Object.assign(
        {
          line1: "Ask your revenue.",
          line2: "",
          emphasis: "",
          size: "title",
          align: "center",
          reveal: "words",
          background: "#f3efe6",
          ink: "#17150f",
          accent: "#2747f0",
          displayFont: "Inter",
        },
        given,
      );
      var slug = function (s) {
        return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-");
      };
      var bare = function (s) {
        return String(s).toLowerCase().replace(/[^a-z0-9À-￿]+/g, "");
      };
      var portrait = H > W;

      // ── Static setup ──
      stage.style.setProperty("--st-accent", v.accent);
      stage.style.setProperty("--st-ink", v.ink);
      stage.className = "st-" + (portrait ? "center" : v.align) + " st-d-" + slug(v.displayFont);
      // The film's margin: 8u at the sides; portrait also keeps clear of social interface areas.
      stage.style.padding = portrait ? "0 30% 18% 12%" : "0 " + 8 * U + "px";
      var size = (v.size === "display" ? 9.6 : 6.2) * U * (portrait ? 0.82 : 1);
      stage.style.fontSize = size + "px";

      var hot = String(v.emphasis).split(/\s+/).map(bare).filter(Boolean);
      var words = [];
      var chips = [];
      [v.line1, v.line2].forEach(function (text, i) {
        var line = $("line" + (i + 1));
        var parts = String(text).trim().split(/\s+/).filter(Boolean);
        if (!parts.length) {
          line.style.display = "none";
          return;
        }
        parts.forEach(function (part, n) {
          var word = document.createElement("span");
          word.className = "st-word";
          var glyphs = document.createElement("span");
          glyphs.className = "st-text";
          glyphs.textContent = part;
          if (hot.indexOf(bare(part)) >= 0) {
            var chip = document.createElement("span");
            chip.className = "st-chip";
            chip.setAttribute("data-layout-allow-overflow", "");
            chip.setAttribute("data-layout-allow-occlusion", "");
            word.appendChild(chip);
            word.style.margin = "0 0.14em";
            chips.push({ chip: chip, word: word });
          }
          word.appendChild(glyphs);
          line.appendChild(word);
          words.push(word);
          if (n < parts.length - 1) line.appendChild(document.createTextNode(" "));
        });
      });

      // ── Timeline ──
      var tl = gsap.timeline({ paused: true });
      var landed = 0;
      if (v.reveal !== "none") {
        // Already arriving at time 0, so a film that opens here has a first frame.
        tl.fromTo(words, { opacity: 0.25, y: 0.3 * size }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.055 }, 0);
        landed = 0.3 + words.length * 0.055;
      }
      // The chip closes over its word after the line has landed: the one accent in the shot.
      chips.forEach(function (c) {
        tl.fromTo(c.chip, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, landed);
        tl.fromTo(c.word, { color: v.ink }, { color: "#ffffff", duration: 0.2, ease: "none" }, landed + 0.05);
      });

      // A slow push for the whole shot, so type that has landed is never a frozen frame.
      tl.fromTo(stage, { scale: 1 }, { scale: 1.03, duration: D, ease: "none" }, 0);

      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
