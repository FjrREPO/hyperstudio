          mask.style.cssText = "overflow:hidden;padding-bottom:0.12em;margin-bottom:-0.12em;width:fit-content;margin-left:" + (place.textAlign === "left" ? "0" : "auto") + ";margin-right:" + (place.textAlign === "right" ? "0" : "auto");

          inner.textContent = text;
          mask.appendChild(inner);
          block.appendChild(mask);

        $("says").appendChild(block);

        var after = says.slice(i + 1).filter(function (n) { return (n.place || "left") === (b.place || "left"); })[0];
        var until = b.over ? b.at + Number(b.over) : after ? after.at : D + 1;
        // A line that opens the film is already half risen at frame 0: that frame is the thumbnail.
        // A line that opens the film is whole at frame 0 (that frame is the thumbnail). Others rise out of
        // their mask while fading in, so no frame shows a line of sharp, half-cut letters; they leave by fading.
        if (b.at <= 0.05) tl.fromTo(lines, { yPercent: 6, opacity: 1 }, { yPercent: 0, opacity: 1, duration: 0.8, ease: "power2.out" }, 0);
        else tl.fromTo(lines, { yPercent: 70, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.75, ease: "expo.out", stagger: 0.1 }, b.at);
        if (until < D) tl.fromTo(block, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, Math.max(b.at + 0.4, until - 0.3));
        placed.push({ block: block, lines: lines, text: String(b.text || "").replace(/\n/g, " "), from: b.at + 0.8, to: Math.min(until - 0.3, D), beside: b.place === "left" || b.place === "right" || !b.place });
      });

      tl.set({}, {}, D);

      // ── Audit: what a careful eye would catch, reported once each so the review sees it ──
      // A camera move that leaves part of its subject outside the frame; a line outside the safe area; a line
      // on top of the interface. The timeline is stepped through once and put back.
      (function () {
        var found = {};
        var note = function (key, text) { if (!found[key]) { found[key] = 1; console.warn("hyperstudio: " + text); } };
        plan.forEach(function (p) {
          if (!p.to || p.b.target === "window") return;
          var l = p.to.x + p.to.scale * p.r[0], t = p.to.y + p.to.scale * (p.r[1] + bar);
          if (l < 0 || t < 0 || l + p.to.scale * p.r[2] > W || t + p.to.scale * p.r[3] > H) note("crop" + p.b.at, "the camera at " + p.b.at + 's leaves part of "' + p.b.target + '" outside the frame; lower its fill or move it');
        });
        var box = function (els) {
          var u = null;
          els.forEach(function (el) { var r = el.getBoundingClientRect(); u = u ? { l: Math.min(u.l, r.left), t: Math.min(u.t, r.top), r: Math.max(u.r, r.right), b: Math.max(u.b, r.bottom) } : { l: r.left, t: r.top, r: r.right, b: r.bottom }; });
          return u;
        };
        for (var t = 0.05; t < D; t += 0.1) {
          tl.seek(t, false);
          // The frame's own box: its top-left corner, and how much the preview has scaled it (1 when rendering).
          var view = stage.getBoundingClientRect(), k = view.width / W || 1, m = 0.03;
          view = { left: view.left, top: view.top, right: view.left + W * k, bottom: view.top + H * k };
          var solid = box([Number(gsap.getProperty(veil, "opacity")) > 0.5 ? veil : $("frame")]);
          placed.forEach(function (s) {
            if (t < s.from || t > s.to) return;
            var r = box(s.lines);
            if (r.l - view.left < W * m * k || r.t - view.top < H * m * k || view.right - r.r < W * m * k || view.bottom - r.b < H * m * k) note("safe" + s.text, '"' + s.text + '" runs outside the safe area');
            var ox = Math.min(r.r, solid.r) - Math.max(r.l, solid.l), oy = Math.min(r.b, solid.b) - Math.max(r.t, solid.t);
            if (!s.beside && ox > 0 && oy > 0 && ox * oy > 0.02 * (r.r - r.l) * (r.b - r.t)) note("over" + s.text, '"' + s.text + '" sits on top of the interface from ' + t.toFixed(1) + "s; move the line, or the product");
          });
        }
        tl.seek(0, false);
      })();
      window.__timelines[ID] = tl;
    })();
  </script>
