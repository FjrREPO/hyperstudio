<template>
  <!--
    PRODUCT SHOT

    One shot of a real product screen. The camera frames one named region of the screenshot and moves to
    another. On top of the screenshot it can move a cursor and click, type into an input, and outline a
    component. Variables are declared in registry-item.json (the compiler writes them onto #root).

    The scene is transparent: the film's stage shows behind the screen, so cutting between shots changes the
    picture and not the place.

    Everything inside #product-shot-world is positioned in the screenshot's own pixels, so overlays stay
    attached to the component they belong to while the camera moves.

    Conventions (docs/RECIPE-DEVELOPMENT.md): the composition id is the recipe name and every element id
    starts with it; frame-space sizes are in u (1% of the canvas's short side); every visible state is a
    function of timeline time.
  -->
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #product-shot-stage {
      --ps-accent: #2747f0;
      --ps-ink: #17150f;
      --ps-paper: #f3efe6;
      position: absolute;
      inset: 0;
      overflow: hidden;
      perspective: 2600px;
    }
    #product-shot-rig {
      position: absolute;
      inset: 0;
    }
    /* The screen, in its own pixel space. GSAP owns its transform. */
    #product-shot-world {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      box-shadow:
        0 0 0 1px rgba(23, 21, 15, 0.1),
        0 30px 90px rgba(23, 21, 15, 0.16);
    }
    /* The whole screenshot. When a component is isolated, the world shrinks to it and this slides under. */
    #product-shot-sheet {
      position: absolute;
    }
    #product-shot-img {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
    #product-shot-type {
      position: absolute;
      display: flex;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
    }
    #product-shot-caret {
      flex: none;
      width: 2px;
      height: 78%;
      margin-left: 2px;
      background: var(--ps-accent);
    }
    #product-shot-outline {
      position: absolute;
      border: 2.5px solid var(--ps-accent);
      border-radius: 12px;
      background: color-mix(in srgb, var(--ps-accent) 7%, transparent);
    }
    #product-shot-ripple {
      position: absolute;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--ps-accent) 30%, transparent);
    }
    #product-shot-cursor {
      position: absolute;
      left: 0;
      top: 0;
      width: 30px;
      height: 30px;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.28));
    }
    #product-shot-label {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 0.3em;
      padding: 0.42em 0.8em;
      border-radius: 0.55em;
      background: var(--ps-ink);
      color: var(--ps-paper);
      font-weight: 500;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    #product-shot-label b {
      font-weight: 600;
      color: color-mix(in srgb, var(--ps-accent) 55%, white);
    }
    .ps-t-inter { font-family: "Inter", sans-serif; }
    .ps-t-outfit { font-family: "Outfit", sans-serif; }
    .ps-t-montserrat { font-family: "Montserrat", sans-serif; }
    .ps-t-poppins { font-family: "Poppins", sans-serif; }
    .ps-t-ibm-plex-mono { font-family: "IBM Plex Mono", monospace; }
  </style>

  <div id="root" data-composition-id="product-shot" data-start="0" data-duration="2" data-width="1920" data-height="1080">
    <div id="product-shot-stage">
      <div id="product-shot-rig">
        <div id="product-shot-world" data-layout-allow-overflow>
          <div id="product-shot-sheet" data-layout-allow-overflow>
          <img id="product-shot-img" data-var-src="screen" alt="" />
          <div id="product-shot-type" data-layout-ignore><span id="product-shot-typed"></span><span id="product-shot-caret"></span></div>
          <div id="product-shot-outline" data-layout-allow-occlusion></div>
          <div id="product-shot-ripple" data-layout-allow-occlusion></div>
          <svg id="product-shot-cursor" viewBox="0 0 30 30" data-layout-allow-occlusion>
            <path d="M5 3l18 9.6-7.6 2.2-2.6 7.6z" fill="#17150f" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
          </div>
        </div>
      </div>
      <div id="product-shot-label"></div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "product-shot";
      var $ = function (name) {
        return document.getElementById(ID + "-" + name);
      };
      var stage = $("stage");
      var scope = stage.closest("[data-composition-id]");
      var W = Number(scope.getAttribute("data-width")) || 1920;
      var H = Number(scope.getAttribute("data-height")) || 1080;
      var D = Number(scope.getAttribute("data-duration")) || 2;
      var U = Math.min(W, H) / 100;

      var given = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
      var v = Object.assign(
        {
          screen: "",
          screenMeta: "",
          isolate: "",
          radius: 14,
          from: "window",
          to: "",
          fill: 0.78,
          move: "settle",
          tilt: "none",
          enter: "none",
          cursor: "",
          click: true,
          clickAt: 0.62,
          highlight: "",
          typeIn: "",
          typeText: "",
          typeColor: "#17150f",
          typeBackground: "#ffffff",
          label: "",
          emphasis: "",
          labelAt: "bottom-left",
          background: "#f3efe6",
          ink: "#17150f",
          accent: "#2747f0",
          textFont: "Inter",
        },
        given,
      );
      var slug = function (s) {
        return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-");
      };
      var meta = { width: 1440, height: 900, regions: {} };
      try {
        meta = JSON.parse(v.screenMeta);
      } catch (e) {
        /* standalone preview: fall back to the whole screen */
      }
      var whole = [0, 0, meta.width, meta.height];
      var onScreen = function (name) {
        return (name && meta.regions[name]) || null;
      };
      var hide = function (el) {
        el.style.display = "none";
      };

      // ── Static setup ──
      stage.style.setProperty("--ps-accent", v.accent);
      stage.style.setProperty("--ps-ink", v.ink);
      stage.style.setProperty("--ps-paper", v.background);
      // Isolate: show one component of the screen on its own, floating on the stage.
      var only = onScreen(v.isolate) || whole;
      // One pixel inside the component, so nothing behind its rounded corners shows.
      if (onScreen(v.isolate)) only = [only[0] + 1, only[1] + 1, only[2] - 2, only[3] - 2];
      var ox = only[0];
      var oy = only[1];
      whole = [0, 0, only[2], only[3]];
      // Regions as the camera sees them: relative to what is shown.
      var rect = function (name) {
        var r = onScreen(name);
        return r ? [r[0] - ox, r[1] - oy, r[2], r[3]] : null;
      };
      var world = $("world");
      world.style.width = only[2] + "px";
      world.style.height = only[3] + "px";
      world.style.borderRadius = (Number(v.radius) || 0) + "px";
      var sheet = $("sheet");
      sheet.style.left = -ox + "px";
      sheet.style.top = -oy + "px";
      sheet.style.width = meta.width + "px";
      sheet.style.height = meta.height + "px";
      var src = typeof v.screen === "string" ? v.screen : (v.screen && v.screen.url) || "";
      if (src) $("img").setAttribute("src", src);

      // Label: a small dark tag in frame space, with at most one accented word.
      var label = $("label");
      var labelText = String(v.label).trim();
      var top = String(v.labelAt).indexOf("top") === 0;
      if (labelText) {
        var hot = String(v.emphasis).trim().toLowerCase();
        labelText.split(/\s+/).forEach(function (word) {
          var el = document.createElement(hot && word.toLowerCase().replace(/[^a-z0-9]/g, "") === hot.replace(/[^a-z0-9]/g, "") ? "b" : "span");
          el.textContent = word;
          label.appendChild(el);
        });
        label.className = "ps-t-" + slug(v.textFont);
        label.style.fontSize = 3.3 * U + "px";
        label.style[top ? "top" : "bottom"] = 7 * U + "px";
        if (String(v.labelAt).indexOf("center") > 0) {
          label.style.left = "0";
          label.style.right = "0";
          label.style.width = "fit-content";
          label.style.margin = "0 auto";
        } else {
          label.style.left = 8 * U + "px";
        }
      } else {
        hide(label);
      }

      // Camera: where the world must sit so that a region fills the frame.
      var fill = Number(v.fill) || 0.78;
      var shift = labelText ? (top ? 3.2 : -3.2) * U : 0; // leave the label's side of the frame clear
      var frame = function (r) {
        var s = Math.min((W * fill) / r[2], (H * fill) / r[3], 3.2);
        return { scale: s, x: W / 2 - s * (r[0] + r[2] / 2), y: H / 2 + shift - s * (r[1] + r[3] / 2) };
      };
      var a = frame(rect(v.from) || whole);
      var toRect = rect(v.to);
      // With nowhere to go, hold the framing and drift in a touch so the shot is never frozen.
      var b = toRect ? frame(toRect) : frame((function (r) {
            var k = 0.035;
            return [r[0] + r[2] * k, r[1] + r[3] * k, r[2] * (1 - 2 * k), r[3] * (1 - 2 * k)];
          })(rect(v.from) || whole));

      // ── Timeline ──
      var tl = gsap.timeline({ paused: true });
      var end = D - 0.04;
      var ease = { settle: "expo.out", ease: "power2.inOut", drift: "none" }[v.move] || "expo.out";
      if (!toRect) ease = "none";

      tl.fromTo(
        world,
        { x: a.x, y: a.y, scale: a.scale, transformOrigin: "0 0" },
        { x: b.x, y: b.y, scale: b.scale, duration: end, ease: ease },
        0,
      );
      if (v.tilt === "left" || v.tilt === "right") {
        var turn = v.tilt === "left" ? 1 : -1;
        tl.fromTo($("rig"), { rotationY: 14 * turn, rotationX: 5 }, { rotationY: 9 * turn, rotationX: 3, duration: end, ease: "power1.out" }, 0);
      }
      if (v.enter === "rise") tl.fromTo($("rig"), { opacity: 0, y: 5 * U }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0);

      // Typing: the text is drawn over the input, in the screenshot's own space.
      var typeRect = rect(v.typeIn);
      var text = String(v.typeText);
      var typeEnd = 0;
      if (typeRect && text) {
        var box = $("type");
        box.className = "ps-t-" + slug(v.textFont);
        box.style.left = typeRect[0] + ox + "px";
        box.style.top = typeRect[1] + oy + "px";
        box.style.width = typeRect[2] + "px";
        box.style.height = typeRect[3] + "px";
        box.style.fontSize = typeRect[3] * 0.69 + "px";
        box.style.color = v.typeColor;
        box.style.background = v.typeBackground;
        var typed = $("typed");
        var caret = $("caret");
        var typeStart = Math.min(0.3, D * 0.12);
        typeEnd = Math.max(typeStart + 0.4, D * 0.78);
        // A property setter, because HyperFrames seeks with events suppressed: onUpdate would never fire.
        var clock = Object.defineProperty({}, "t", {
          get: function () {
            return 0;
          },
          set: function (t) {
            var p = Math.max(0, Math.min(1, (t - typeStart) / (typeEnd - typeStart)));
            typed.textContent = text.slice(0, Math.round(p * text.length));
            var typing = p > 0 && p < 1;
            caret.style.opacity = typing || Math.floor(t * 2.5) % 2 === 0 ? 1 : 0;
          },
        });
        tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none" }, 0);
      } else {
        hide($("type"));
      }

      // Outline a component.
      var outlineRect = rect(v.highlight);
      if (outlineRect) {
        var pad = 8;
        var outline = $("outline");
        outline.style.left = outlineRect[0] + ox - pad + "px";
        outline.style.top = outlineRect[1] + oy - pad + "px";
        outline.style.width = outlineRect[2] + pad * 2 + "px";
        outline.style.height = outlineRect[3] + pad * 2 + "px";
        tl.fromTo(outline, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, Math.min(0.5, D * 0.3));
      } else {
        hide($("outline"));
      }

      // Cursor: travels to a component, and clicks.
      var target = rect(v.cursor);
      if (target) {
        // Aim below and right of centre so the arrow does not cover the component's own text.
        var cx = target[0] + ox + target[2] * 0.66;
        var cy = target[1] + oy + target[3] * 0.66;
        // Keep the arrow readable in a wide shot without letting it grow huge in a close one.
        var cursorSize = Math.max(30, Math.min(64, 42 / b.scale));
        $("cursor").style.width = $("cursor").style.height = cursorSize + "px";
        var arrive = Math.max(0.5, D * (Number(v.clickAt) || 0.62));
        var leave = Math.max(typeEnd, arrive - 0.9, 0);
        var cursor = $("cursor");
        // Start below and to the right of the target, inside the screen. The arrow's tip is its top-left.
        var sx = cx + Math.min(230, 420 / b.scale);
        var sy = cy + Math.min(150, 280 / b.scale);
        tl.fromTo(cursor, { x: sx - 5, y: sy - 3, opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, Math.max(0, leave - 0.05));
        tl.fromTo(cursor, { x: sx - 5 }, { x: cx - 5, duration: arrive - leave, ease: "power2.inOut", immediateRender: false }, leave);
        tl.fromTo(cursor, { y: sy - 3 }, { y: cy - 3, duration: arrive - leave, ease: "power3.out", immediateRender: false }, leave);
        var ripple = $("ripple");
        ripple.style.left = cx + "px";
        ripple.style.top = cy + "px";
        if (v.click !== false && v.click !== "false") {
          tl.fromTo(cursor, { scale: 1 }, { keyframes: [{ scale: 0.8, duration: 0.08 }, { scale: 1, duration: 0.16 }], transformOrigin: "20% 12%" }, arrive);
          tl.fromTo(ripple, { opacity: 0, scale: 0.3 }, { keyframes: [{ opacity: 0.9, duration: 0.02 }, { opacity: 0, scale: 1.7, duration: 0.5, ease: "power2.out" }] }, arrive);
        } else {
          hide(ripple);
        }
      } else {
        hide($("cursor"));
        hide($("ripple"));
      }

      if (labelText) tl.fromTo(label, { opacity: 0, y: (top ? -1 : 1) * U }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, Math.min(0.2, D * 0.1));

      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
