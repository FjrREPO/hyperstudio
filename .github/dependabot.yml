version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ["type: chore", "area: tooling"]
    groups:
      dev-tooling:
        patterns: ["@biomejs/*", "typescript", "@types/*", "husky"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["type: chore", "area: repo"]
